<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask + MySQL Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; }
    .status { padding: 12px; border-radius: 6px; }
    .success { background: #e8f5e9; color: #1b5e20; }
    .failure { background: #ffebee; color: #b71c1c; }
  </style>
</head>
<body>
  <h1>Flask + MySQL Demo</h1>

  {% if db_connected %}
    <p class="status success">MySQL connection successful.</p>
  {% else %}
    <p class="status failure">MySQL connection failed.</p>
  {% endif %}

  <p>{{ db_message }}</p>
</body>
</html>
